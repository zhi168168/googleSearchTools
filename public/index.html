<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Google 搜索查询</title><link rel="stylesheet" href="/style.css"><script src="/app.js" defer></script></head>
<body><main><header><p class="eyebrow">GOOGLE SEARCH TOOLS</p><h1>输入搜索词，查看完整返回</h1><p class="intro">通过 GloryCloud 查询 Google，保留搜索结果、分页信息及接口错误。</p></header>
<form id="search-form"><label for="token">调用令牌</label><input id="token" type="password" autocomplete="off" required placeholder="输入转发服务的调用令牌"><p class="hint">令牌仅用于本次请求，不保存在浏览器中。</p><label for="q">搜索词</label><textarea id="q" rows="3" required maxlength="2000">inurl:blog + "leave a reply" + tool</textarea><div class="options"><div><label for="page">页码</label><input id="page" type="number" min="1" max="100" value="1" required></div><div><label for="domain">Google 域名后缀</label><input id="domain" value="com.hk" required></div><div><label for="language">界面语言</label><input id="language" value="zh-CN" required></div></div><button id="submit" type="submit">查询搜索结果</button></form>
<section class="response" aria-labelledby="response-title"><div class="response-head"><h2 id="response-title">完整返回</h2><button id="download" type="button" class="secondary" disabled>下载 JSON</button></div><p id="status" role="status" aria-live="polite">查询后将在这里显示接口原始响应。</p><pre id="result" tabindex="0">等待查询</pre></section><footer>每次查询仅请求一页。调整页码可继续查询；接口可能按请求扣除额度。</footer></main></body></html>
